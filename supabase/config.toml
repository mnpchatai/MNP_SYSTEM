project_id = "mnp-internal-system"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]

[storage]
enabled = true
file_size_limit = "20MiB"


# Apps Script ของชีต Mooney ยิงมาจากเซิร์ฟเวอร์ Google ไม่มี JWT ของผู้ใช้ — ฟังก์ชันตรวจ secret
# ใน header x-lab-sync-secret เอง (ดู supabase/functions/lab-sheet-sync/index.ts)
[functions.lab-sheet-sync]
verify_jwt = false
