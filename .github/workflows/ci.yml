name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# push ใหม่เข้า PR เดิม ยกเลิกรอบที่ยังรันค้าง
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build

  pr-guards:
    name: PR guards
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: scripts/ci/check-pr-guards.sh "origin/${{ github.base_ref }}"

  db:
    name: Database tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # job นี้รายงานผลทุกครั้ง (branch protection อ้างชื่อนี้) แต่ PR ที่ไม่แตะสิ่งที่ db:test / test:storage พึ่งพา
      # ข้ามขั้นที่ช้าด้านล่าง push เข้า main และสั่งรันเองจากแท็บ Actions รันครบเสมอ
      # ถ้าตัวกรองล้มเหลว step นี้ล้ม job จึงล้มตาม (ไม่ข้ามเงียบ ๆ)
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            merge_base="$(git merge-base "origin/$BASE_REF" HEAD)"
            # --no-renames: ไม่งั้น git พิมพ์เฉพาะพาธปลายทางของไฟล์ที่ย้าย และการย้ายไฟล์ออกจาก supabase/ จะหลุดตัวกรอง
            changed="$(git -c core.quotepath=off diff --name-only --no-renames "$merge_base" HEAD)"
            run="$(scripts/ci/needs-db-tests.sh <<< "$changed")"
          else
            run=true
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Database tests: $run"
      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.scope.outputs.run == 'true'
        run: npm ci
      # stack local ใน runner เท่านั้น (ไม่แตะ Supabase Cloud) ข้าม service ที่ test ไม่ใช้
      - if: steps.scope.outputs.run == 'true'
        run: npx supabase start -x studio,imgproxy,mailpit,logflare,vector,edge-runtime,realtime,supavisor,postgres-meta
      - if: steps.scope.outputs.run == 'true'
        run: npm run db:test
      - if: steps.scope.outputs.run == 'true'
        run: npm run test:storage
      - if: always() && steps.scope.outputs.run == 'true'
        run: npx supabase stop --no-backup
